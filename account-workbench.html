<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>账号运营分析台</title>
<!-- 本工作台通过 WorkBuddy「资料库」skill 搭建、存储和部署 -->
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1e2430; --muted:#6b7280; --line:#e9ecf3;
  --primary:#4f46e5; --primary-soft:#eef0ff; --up:#e11d48; --down:#16a34a;
  --warn:#f59e0b; --warn-soft:#fff7e6; --danger:#e11d48; --danger-soft:#fff1f3;
  --shadow:0 1px 2px rgba(20,25,45,.05),0 8px 24px rgba(20,25,45,.06);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.55; padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 40px}
h1,h2,h3{margin:0;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hd h1{font-size:17px;letter-spacing:.2px}
.hd .sub{font-size:12px;color:var(--muted);margin-top:1px}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:#f7f8fc;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--down);display:inline-block}
.dot.loading{background:var(--warn)}
.dot.off{background:#c7cad4}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d3d7e3;background:#fafbff}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.sm{padding:4px 9px;min-height:30px;font-size:12px;border-radius:7px}

/* ---------- control bar ---------- */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:14px}
.tabs{display:inline-flex;background:#f1f3f9;border-radius:10px;padding:3px;gap:2px}
.tab{border:0;background:transparent;color:var(--muted);font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;min-height:34px;font-family:inherit}
.tab.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(20,25,45,.08)}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=date]{font-family:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-height:36px;max-width:180px}

/* ---------- section ---------- */
.sec{margin-bottom:16px;padding:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-hd h2{font-size:15px}
.sec-hd .tag{font-size:11px;color:var(--muted);background:#f2f4f9;border-radius:6px;padding:2px 7px}
.sec-hd .sp{margin-left:auto}

/* ---------- today / alert ---------- */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#fcfcfe}
.alert.lv-hi{background:var(--danger-soft);border-color:#fbd5dc}
.alert.lv-md{background:var(--warn-soft);border-color:#ffe6b8}
.alert.done{opacity:.5}
.alert .ic{flex:0 0 auto;margin-top:2px}
.alert .tx{flex:1;min-width:0}
.alert .tx b{font-weight:650}
.alert .tx .why{font-size:12px;color:var(--muted);margin-top:2px}
.alert .ac{flex:0 0 auto}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;background:#fafbfe;border:1px dashed var(--line);border-radius:11px}
.tip-line{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:center}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.seg-inline{display:inline-flex;background:#f1f3f9;border-radius:9px;padding:3px;gap:2px;flex:0 0 auto}
.seg-inline button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px 14px;border-radius:7px;cursor:pointer;min-height:30px;font-family:inherit}
.seg-inline button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(20,25,45,.1)}
.rank-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.rank-hd .sp2{margin-left:auto}
.rank-hd .metric-switch .chip{padding:3px 9px;font-size:11.5px;min-height:26px}
.kpi{background:#fbfcff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi .lb{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .vl{font-size:19px;font-weight:680;margin-top:3px;letter-spacing:-.3px}
.kpi .dl{font-size:11.5px;margin-top:2px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:820px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f7f8fc;color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}
th:first-child{background:#f7f8fc;z-index:3}
tbody tr:hover td{background:#fafbff}
tr.sum td{background:#f5f7ff;font-weight:650}
tr.sum td:first-child{background:#f5f7ff}
td.pname,.rank-row div.pname{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-cell{position:relative}
.bar-cell .bg{position:absolute;left:0;top:50%;transform:translateY(-50%);height:16px;background:var(--primary-soft);border-radius:4px;z-index:0}
.bar-cell span{position:relative;z-index:1}

/* ---------- chart ---------- */
.chart-box{width:100%;overflow-x:auto;position:relative}
#chartTip{position:fixed;pointer-events:none;background:#1e2430;color:#fff;border-radius:8px;padding:7px 11px;font-size:12px;line-height:1.55;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:80;box-shadow:0 6px 18px rgba(20,25,45,.25)}
#chartTip .tt{color:#a5b4fc;font-size:11px}
#chartTip .tv{font-weight:700;font-size:13px}
#chartTip .td{font-size:11px}

/* ---------- 日期选择器 ---------- */
.tag-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 9px;font-size:11.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:26px;font-family:inherit}
.tag-btn:hover{border-color:#c7cbf5;color:var(--primary);background:var(--primary-soft)}
.tag-btn svg{flex:0 0 auto}
.picker-mask{position:fixed;inset:0;background:rgba(20,25,45,.28);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:56px 14px 14px}
.picker-mask.show{display:flex}
.picker{background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(20,25,45,.2);padding:15px;width:100%;max-width:390px}
.picker h3{font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.p-row{display:flex;gap:8px;margin-bottom:10px}
.p-seg{display:inline-flex;background:#f1f3f9;border-radius:9px;padding:3px;gap:2px;flex:1}
.p-seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:6px 0;border-radius:7px;cursor:pointer;min-height:30px;flex:1;font-family:inherit}
.p-seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(20,25,45,.1)}
.p-fields{display:flex;gap:8px;margin-bottom:10px}
.p-fields label{flex:1;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.p-fields input,.p-fields select{width:100%;max-width:none;font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;color:var(--text);background:#fff;min-height:38px}
.p-fields input:disabled{background:#f5f6fa;color:#b9bdca}
.p-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.p-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.p-acts .btn{min-width:76px;justify-content:center}
.p-note{font-size:11.5px;color:var(--muted);margin-top:9px}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.metric-switch{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted);min-height:28px}
.chip.on{background:var(--primary-soft);border-color:#c7cbf5;color:var(--primary);font-weight:600}

/* ---------- funnel ---------- */
.funnel{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.funnel .steps{display:flex;flex-direction:column;gap:7px}
.fstep{position:relative}
.fstep .fbg{height:30px;border-radius:8px;background:linear-gradient(90deg,#6366f1,#a5b4fc);display:flex;align-items:center;padding:0 10px;color:#fff;font-size:12.5px;font-weight:600;min-width:64px}
.fstep .fmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.rate-line{font-size:12px;color:var(--muted);text-align:center;padding:1px 0}
.rate-line b{color:var(--primary)}
.rank{display:flex;flex-direction:column;gap:9px}
.rank-row{display:flex;align-items:center;gap:9px;font-size:13px}
.rank-row .nm{width:104px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .tr{flex:1;height:18px;background:#f1f3f9;border-radius:5px;overflow:hidden}
.rank-row .fl{height:100%;border-radius:5px;background:linear-gradient(90deg,#6366f1,#818cf8)}
.rank-row .vv{width:82px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.score{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;font-weight:700;font-size:14px}

/* ---------- advice ---------- */
.adv{display:flex;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fcfcfe;margin-bottom:8px}
.adv .n{width:20px;height:20px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.adv .t{font-size:13px}
.adv .t i{font-style:normal;color:var(--muted);font-size:12px;display:block;margin-top:1px}

.note{font-size:12px;color:var(--muted);line-height:1.7}
.foot{text-align:center;color:#9aa0b0;font-size:12px;padding:8px 0 0}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#eef0f6,#f7f8fc,#eef0f6);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .funnel{grid-template-columns:1fr}
}
@media (max-width:768px){
  .wrap{padding:12px 10px 30px}
  .hd{padding:12px}
  .sec{padding:13px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi .vl{font-size:17px}
  .ctrl{padding:10px}
  .ctrl .field{width:100%}
  .ctrl select, .ctrl input[type=date]{flex:1;max-width:none;width:100%}
  .tabs{width:100%}
  .tab{flex:1;padding:8px 0}
  .rank-row .nm{width:78px;font-size:12px}
  .rank-row .vv{width:66px;font-size:12px}
  .sec-hd h2{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="card hd">
    <div class="logo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    </div>
    <div>
      <h1>账号运营分析台</h1>
      <div class="sub" id="hdSub" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs">数据加载中…</div>
    </div>
    <div class="hd-right">
      <span class="sync" id="syncBox"><i class="dot loading" id="syncDot"></i><span id="syncTxt">同步中</span></span>
      <span class="sync" id="reqBox" style="display:none" data-sp-bindable="database" data-sp-database-id="1y8ejlIduZbq4WY3uad8DR"><i class="dot loading" id="reqDot"></i><span id="reqTxt"></span></span>
      <button class="btn sm" id="btnRefresh" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>刷新
      </button>
      <button class="btn sm primary" id="btnSync" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>同步腾讯文档
      </button>
      <button class="btn sm" id="btnExport" type="button">导出快照</button>
    </div>
  </div>

  <div class="card ctrl">
    <div class="tabs" id="grainTabs">
      <button class="tab on" type="button" data-grain="day">日</button>
      <button class="tab" type="button" data-grain="month">月</button>
      <button class="tab" type="button" data-grain="year">年</button>
    </div>
    <button class="btn" id="periodBtn" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
      <span id="periodBtnTxt">选择日期</span>
    </button>
    <label class="field">账号
      <select id="acctSel"></select>
    </label>
    <span class="field" id="scopeTxt" style="margin-left:auto"></span>
  </div>

  <!-- 模块1：今日要处理 + 核心指标 -->
  <div class="card sec">
    <div class="sec-hd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <h2>今日要处理</h2>
      <span class="tag" id="todayTag">—</span>
      <span class="sp"></span>
      <button class="btn sm" id="btnResetDone" type="button">恢复已处理</button>
    </div>
    <div class="alert-list" id="alertList" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs"></div>
    <div class="tip-line" id="tipLine" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs"></div>
    <div style="height:14px"></div>
    <div class="kpis" id="kpiGrid" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs"></div>
  </div>

  <!-- 模块2：账号对比 -->
  <div class="card sec">
    <div class="sec-hd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="8"/><rect x="13" y="6" width="3" height="12"/></svg>
      <h2>账号 / 商品对比</h2>
      <button class="tag tag-btn" id="cmpTag" type="button" title="点击选择日期或区间">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span id="cmpTagTxt">—</span>
      </button>
      <span class="sp"></span>
      <div class="seg-inline" id="cmpTabSeg">
        <button type="button" data-t="acct" class="on">账号维度</button>
        <button type="button" data-t="prod">商品维度</button>
        <button type="button" data-t="promo">推广维度</button>
      </div>
    </div>
    <div class="tbl-scroll" id="acctTableWrap"><table id="acctTable" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs"></table></div>
    <div id="prodWrap" style="display:none">
      <div class="kpis k5" id="prodKpis" data-sp-bindable="database" data-sp-database-id="z6wRbDAhPSaJ9D5bYOYIOk"></div>
      <div style="height:12px"></div>
      <div class="tbl-scroll"><table id="prodTable" data-sp-bindable="database" data-sp-database-id="z6wRbDAhPSaJ9D5bYOYIOk"></table></div>
      <div style="height:14px"></div>
      <div class="rank-hd">商品 TOP10 · <span id="prodRankMetric">按支付金额</span>
        <span class="sp2"></span>
        <span class="metric-switch" id="prodMetricSwitch"></span>
      </div>
      <div class="rank" id="prodRank" data-sp-bindable="database" data-sp-database-id="z6wRbDAhPSaJ9D5bYOYIOk"></div>
      <div style="height:14px"></div>
      <div class="rank-hd">各账号商品结构</div>
      <div class="rank" id="prodAcctRank" data-sp-bindable="database" data-sp-database-id="z6wRbDAhPSaJ9D5bYOYIOk"></div>
    </div>
    <div id="promoWrap" style="display:none">
      <div class="kpis" id="promoKpis" data-sp-bindable="database" data-sp-database-id="jNNOmZBBXGRNGK194W8gV9"></div>
      <div style="height:12px"></div>
      <div class="tbl-scroll"><table id="promoTable" data-sp-bindable="database" data-sp-database-id="jNNOmZBBXGRNGK194W8gV9"></table></div>
      <div style="height:14px"></div>
      <div class="rank-hd">投产比排行（交易额 ÷ 擦亮花费）
        <span class="sp2"></span>
        <span class="metric-switch" id="promoCostSwitch"></span>
      </div>
      <div class="rank" id="promoRank" data-sp-bindable="database" data-sp-database-id="jNNOmZBBXGRNGK194W8gV9"></div>
      <div style="height:14px"></div>
      <div class="rank-hd">推广漏斗（曝光 → 点击 → 询单 → 咨询 → 下单）</div>
      <div class="steps" id="promoFunnel" data-sp-bindable="database" data-sp-database-id="jNNOmZBBXGRNGK194W8gV9"></div>
    </div>
  </div>

  <!-- 模块3：趋势分析 -->
  <div class="card sec">
    <div class="sec-hd">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3.5-4 3 3L21 6"/></svg>
      <h2>趋势分析</h2>
      <button class="tag tag-btn" id="trendTag" type="button" title="点击选择日期或区间">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span id="trendTagTxt">—</span>
      </button>
      <span class="sp"></span>
      <div class="metric-switch" id="metricSwitch"></div>
    </div>
    <div class="chart-box" id="trendBox" data-sp-bindable="database" data-sp-database-id="Sy50vzHB3nutPgCov3jQZs"></div>
    <div class="legend" id="trendLegend"></div>
  </div>

  <!-- 模块4：转化漏斗与诊断 -->

        out.push({ lv: 'hi', acct: a, title: '有流量无成交', why: '曝光 ' + Math.round(n(r.expoPpl)) + ' 人，支付金额 ¥0，转化链路断裂' });

        out.push({ lv: 'hi', acct: a, title: 'GMV 大幅下滑', why: '支付金额 ¥' + Math.round(n(r.payAmt)) + '，较前一日 ¥' + Math.round(n(p.payAmt)) + ' 腰斩' });

  function niceMax(m) {

  function lineChart(labels, values, type, hiIndex) {
    var W = 900, H = 250, PL = 60, PR = 16, PT = 18, PB = 38;
    var iw = W - PL - PR, ih = H - PT - PB;
    var max = 0, i;
    for (i = 0; i < values.length; i++) if (values[i] > max) max = values[i];
    var top = niceMax(max);
    if (top <= 0) top = 1;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="250" preserveAspectRatio="none" style="display:block;min-width:640px">';
    s += '<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>' +
      '<stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/></linearGradient></defs>';
    for (i = 0; i <= 4; i++) {

  /* ---- 同步请求（网页点击 → 写入请求表 → 自动化执行 → 页面自动刷新） ---- */
  function nowStr() {
    var d = new Date(), p = function (x) { return x < 10 ? '0' + x : String(x); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function loadReqState() {
    if (!db) return;
    db.query({
      databaseId: '1y8ejlIduZbq4WY3uad8DR',
      sorts: [{ property: RQ.time, direction: 'descending' }],
      pageSize: 1
    }).then(function (r) {
      var rec = (r.results && r.results[0]) || null;
      var wasPending = state.reqPending;
      state.lastReq = rec;
      state.reqPending = !!(rec && rec[RQ.status] === '待处理');
      if (!state.reqPending) reqCacheClear();
      if (wasPending && !state.reqPending) {
        fetchData().then(function () { setSync('on'); refreshAll(); })
          .catch(function () { refreshAll(); });
        return;
      }
      refreshAll();
    }).catch(function () { refreshAll(); });
  }
  function renderReqState() {
    var box = $('reqBox'), txt = $('reqTxt'), dot = $('reqDot');
    if (!box || !txt || !dot) return;
    var rec = state.lastReq;
    if (!rec && !state.reqPending) { box.style.display = 'none'; return; }
    box.style.display = '';
    if (state.reqPending) {
      dot.className = 'dot loading';
      bind(txt).textContent = '同步已提交，等待执行…';
    } else {
      var st = rec[RQ.status] || '';
      dot.className = (st === '失败') ? 'dot off' : 'dot';
      var t = String(rec[RQ.time] || '').slice(5, 16);
      var rs = String(rec[RQ.result] || '');
      bind(txt).textContent = '腾讯文档同步 ' + t + ' · ' + st + (rs ? '（' + rs + '）' : '');
    }
  }
  var REQ_KEY = 'wb_acct_sync_req_at';
  function reqCacheGet() {
    try { return localStorage.getItem(REQ_KEY) || ''; } catch (e) { return ''; }
  }
  function reqCacheSet(v) {
    try { localStorage.setItem(REQ_KEY, v); } catch (e) {}
  }
  function reqCacheClear() {
    try { localStorage.removeItem(REQ_KEY); } catch (e) {}
  }
  function requestSync() {
    if (!db) {
      var b0 = $('reqBox');
      if (b0) { b0.style.display = ''; $('reqDot').className = 'dot off'; bind($('reqTxt')).textContent = '离线模式，无法提交同步'; }
      return;
    }
    var last = reqCacheGet();
    if (last && state.reqPending) {
      var b1 = $('reqBox');
      if (b1) {
        b1.style.display = '';
        $('reqDot').className = 'dot loading';
        bind($('reqTxt')).textContent = '已提交（' + last.slice(11) + '），请等待执行完成';
      }
      return;
    }
    var btn = $('btnSync');
    state.reqPending = true;
    reqCacheSet(nowStr());
    renderReqState();
    var props = {};
    props[RQ.time] = { text: nowStr() };
    props[RQ.status] = { select: '待处理' };
    props[RQ.src] = { text: '工作台点击' };
    db.addRecord({ databaseId: '1y8ejlIduZbq4WY3uad8DR', properties: props })
      .then(function () { loadReqState(); })
      .catch(function () {
        state.reqPending = false;
        reqCacheClear();
        var box = $('reqBox');
        if (box) {
          box.style.display = '';
          $('reqDot').className = 'dot off';
          bind($('reqTxt')).textContent = '同步请求提交失败，请稍后重试';
        }
      });
  }

  function setSync(mode) {

    if (mode === 'on') { d.className = 'dot'; t.textContent = '已同步'; }
    else if (mode === 'loading') { d.className = 'dot loading'; t.textContent = '同步中'; }
    else { d.className = 'dot off'; t.textContent = '离线模式'; }
  }

  function fetchData() {
    setSync('loading');
    return loadOps().then(function (raw) {
      if (!raw || !raw.length) throw new Error('empty');
      state.rows = raw.map(normalize);
      return loadProd();
    }).then(function (praw) {
      state.prodRows = (praw || []).map(normalizeProd);
      return loadPromo();
    }).then(function (mraw) {
      state.promoRows = (mraw || []).map(normalizePromo);
      fillPayPplFromProd();
      state.offline = false;
      return true;
    });
  }

  function bootPeriod(force) {
    var ds = state.rows.map(function (r) { return r.date; }).sort();
    if (!ds.length) return;
    var g = state.grain, last = ds[ds.length - 1];
    if (force) { state.mode = 'single'; state.pA = state.pB = keyOf(last, g); return; }
    var anchorKey = keyOf(state.pB || state.pA || last, g);
    var cand = ds.filter(function (d) { return keyOf(d, g) === anchorKey; });
    var target;
    if (cand.length) target = cand[cand.length - 1];
    else {
      var before = ds.filter(function (d) { return keyOf(d, g) <= anchorKey; });
      target = before.length ? before[before.length - 1] : last;
    }
    state.pA = state.pB = keyOf(target, g);
  }

      fetchData().then(function () { setSync('on'); loadReqState(); }).catch(function () { setSync('off'); });
    };
    $('btnSync').onclick = requestSync;
    $('btnResetDone').onclick = function () { state.done = {}; saveDone(); refreshAll(); };
    $('btnExport').onclick = function () {
      var blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), rows: state.rows, prodRows: state.prodRows, promoRows: state.promoRows }, null, 2)],
        { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '账号运营数据快照_' + (state.latestDate || 'export') + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    };

    fetchData().then(function () {
      setSync('on');
      bootPeriod(true);
      refreshAll();
      loadReqState();
    }).catch(function () {
      state.rows = demoRows();
      state.prodRows = prodDemoRows();
      state.promoRows = promoDemoRows();
      state.offline = true;
      setSync('off');
      bootPeriod(true);
      refreshAll();
    });

    if (db && typeof db.onUpdated === 'function') {
      var timer = null;
      db.onUpdated(function (payload) {
        var ids = (payload && payload.databaseIds) || [];
        var hitMain = ids.indexOf(DATABASE_ID) >= 0 || ids.indexOf(PROD_DATABASE_ID) >= 0 || ids.indexOf(PROMO_DATABASE_ID) >= 0;
        var hitReq = ids.indexOf(REQ_DATABASE_ID) >= 0;
        if (ids.length && !hitMain && !hitReq) return;
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () {
          timer = null;
          if (hitReq) {
            loadReqState();
          } else {
            fetchData().then(function () { setSync('on'); refreshAll(); }).catch(function () {});
          }
        }, 300);
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
